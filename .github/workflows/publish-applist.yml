name: Publish Steam app list

# Runs daily (and on demand) to refresh data/riftctrl_appid.json, the app list RIFT//CTRL consumes
# as its first app-id source. Requires the STEAM_API_KEY repo secret (free — see README).

on:
  schedule:
    - cron: "17 5 * * *" # 05:17 UTC daily
  workflow_dispatch: {}

permissions:
  contents: write # allow the job to commit the refreshed list

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build app list
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: node scripts/build-applist.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/riftctrl_appid.json
          if git diff --staged --quiet; then
            echo "No changes to publish."
          else
            git commit -m "chore: update app list $(date -u +%FT%TZ)"
            git push
          fi
