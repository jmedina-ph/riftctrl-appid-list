name: Publish Steam app list

# Runs a few times a day. Two steps produce data the RIFT dashboard reads:
#   1. watch-servers.mjs — anonymous Steam login; records dedicated servers seen changing in PICS
#      (fills the tool-server gap no web API exposes). Accumulates into data/tracked_servers.json.
#   2. build-applist.mjs — pulls the keyed base catalog and UNIONs the tracked servers into the
#      single published file data/riftctrl_appid.json.
# Requires the STEAM_API_KEY repo secret for the base catalog (free — see README). The watcher needs
# no key.

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours (keeps the PICS change window small)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Watch PICS for dedicated servers
        run: node scripts/watch-servers.mjs

      - name: Build published list
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: node scripts/build-applist.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage ONLY this job's directory. A second scheduled workflow publishes commands/,
          # and two jobs staging the same paths is how one silently commits the other's work.
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "chore: update app list $(date -u +%FT%TZ)"
          # Both scheduled jobs push to main, so this one can be rejected non-fast-forward through
          # no fault of its own. Without this retry the loser's run is discarded with no error
          # anyone sees. Rebase onto whatever landed while we were running, then try again.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected (attempt $attempt) - rebasing onto origin/main"
            git pull --rebase origin main
          done
          echo "could not push after 3 attempts" >&2
          exit 1
