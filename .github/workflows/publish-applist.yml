name: Publish Steam app list

# Runs a few times a day. Two steps produce data the RIFT dashboard reads:
#   1. watch-servers.mjs — anonymous Steam login; records dedicated servers seen changing in PICS
#      (fills the tool-server gap no web API exposes). Accumulates into data/tracked_servers.json.
#   2. build-applist.mjs — pulls the keyed base catalog and UNIONs the tracked servers into the
#      single published file data/riftctrl_appid.json.
# Requires the STEAM_API_KEY repo secret for the base catalog (free — see README). The watcher needs
# no key.

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours (keeps the PICS change window small)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Watch PICS for dedicated servers
        run: node scripts/watch-servers.mjs

      - name: Build published list
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: node scripts/build-applist.mjs

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to publish."
          else
            git commit -m "chore: update app list $(date -u +%FT%TZ)"
            git push
          fi
